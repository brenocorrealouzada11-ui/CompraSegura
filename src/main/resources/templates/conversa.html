<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conversa | CompraSegura</title><link rel="stylesheet" th:href="@{/css/conta.css}"><link rel="stylesheet" th:href="@{/css/chat.css}"><script defer th:src="@{/js/chat.js}"></script></head><body>
<header th:replace="~{fragments/conta :: header}"></header><div class="shell"><aside th:replace="~{fragments/conta :: sidebar('mensagens')}"></aside><main id="conteudo">
<a class="back-link" th:href="@{/minha-conta/mensagens}">← Todas as conversas</a>
<section id="chat" class="card chat-panel" th:attr="data-novas=@{/minha-conta/mensagens/{id}/novas(id=${conversa.id})},data-historico=@{/minha-conta/mensagens/{id}/historico(id=${conversa.id})},data-lida=@{/minha-conta/mensagens/{id}/lida(id=${conversa.id})},data-enviar=@{/minha-conta/mensagens/{id}/enviar(id=${conversa.id})}">
<header class="chat-heading"><p class="eyebrow" th:text="${conversa.comprador ? 'Conversando com o vendedor' : 'Conversando com o comprador'}"></p><h1 th:text="${conversa.pessoa}"></h1><p th:text="${conversa.titulo}"></p><a id="link-anuncio-chat" th:if="${conversa.anuncioId != null}" th:href="@{/anuncios/{id}(id=${conversa.anuncioId})}">Ver anúncio</a><p id="anuncio-indisponivel" class="muted" th:attr="hidden=${conversa.anuncioId != null}">Este anúncio não está disponível na pesquisa. A conversa continua acessível aos participantes.</p></header>
<div class="chat-history"><a id="mensagens-anteriores" th:if="${conversa.lote.temMais}" th:href="@{/minha-conta/mensagens/{id}(id=${conversa.id},antes=${conversa.lote.primeiraId})}">Ver mensagens anteriores</a></div>
<div id="chat-mensagens" class="chat-messages" role="log" aria-label="Histórico de mensagens" aria-live="polite" aria-relevant="additions" tabindex="0">
<p id="chat-vazio" class="muted" th:if="${conversa.lote.mensagens.isEmpty()}">Ainda não há mensagens. Comece a conversa abaixo.</p>
<article class="chat-message" th:each="item : ${conversa.lote.mensagens}" th:classappend="${item.propria ? 'mine' : 'received'}" th:attr="data-mensagem-id=${item.id}"><span class="chat-author" th:text="${item.propria ? 'Você' : conversa.pessoa}"></span><p class="chat-text" th:text="${item.texto}"></p><small class="chat-time" th:text="${item.horario}"></small></article>
</div><button id="ir-para-novas" class="button secondary" type="button" hidden>Ir para as novas mensagens</button>
<form id="form-chat" class="chat-composer" th:action="@{/minha-conta/mensagens/{id}(id=${conversa.id})}" th:object="${mensagem}" method="post">
<div class="aviso-erro" th:if="${#fields.hasAnyErrors()}" role="alert"><p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p></div>
<input type="hidden" th:field="*{chave}"><div class="campo"><label for="texto">Sua mensagem</label><textarea id="texto" th:field="*{texto}" required maxlength="2000" rows="3" placeholder="Pergunte sobre o aparelho, o estado de conservação ou a negociação." aria-describedby="ajuda-mensagem status-chat"></textarea><small id="ajuda-mensagem">Até 2.000 caracteres. Ctrl + Enter também envia.</small></div><div class="actions"><button id="enviar-mensagem" class="button" type="submit">Enviar mensagem</button><span id="status-chat" class="muted" role="status" aria-live="polite"></span></div></form>
<noscript><p>Recarregue a página para ver novas respostas.</p><form th:action="@{/minha-conta/mensagens/{id}/marcar-lida(id=${conversa.id})}" method="post"><input type="hidden" name="ate" th:value="${conversa.lote.ultimaId}"><button class="button secondary" type="submit">Marcar mensagens exibidas como lidas</button></form></noscript>
</section></main></div></body></html>
