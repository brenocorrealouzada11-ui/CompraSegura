<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Foto de perfil | CompraSegura</title><link rel="stylesheet" th:href="@{/css/conta.css}"></head><body><header th:replace="~{fragments/conta :: header}"></header><div class="shell"><aside th:replace="~{fragments/conta :: sidebar('perfil')}"></aside><main id="conteudo"><section class="card form-card"><p class="eyebrow">Minha conta</p><h1>Foto de perfil</h1><p>Opcional. A foto aparecerá junto ao seu nome nos anúncios publicados e no seu perfil de vendedor.</p><div class="success" role="status" th:if="${fotoSalva}" th:text="${fotoSalva}"></div><div class="aviso-erro" role="alert" th:if="${erroFoto}" th:text="${erroFoto}"></div><img class="profile-photo profile-preview" th:if="${temFoto}" th:src="@{/minha-conta/foto/imagem}" alt="Sua foto de perfil atual"><form th:action="@{/minha-conta/foto}" method="post" enctype="multipart/form-data"><div class="campo"><label for="arquivo">Escolha uma foto</label><input id="arquivo" name="arquivo" type="file" accept="image/png,image/jpeg" required><small>PNG ou JPEG, até 5 MB.</small></div><button class="button" type="submit">Salvar foto de perfil</button></form><form th:if="${temFoto}" th:action="@{/minha-conta/foto}" method="post" class="actions"><input type="hidden" name="remover" value="true"><button class="button danger-outline" type="submit">Remover foto</button></form><p><a th:href="@{/minha-conta}">Voltar à minha conta</a></p></section></main></div></body></html>
