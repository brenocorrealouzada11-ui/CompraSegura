<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="lista">
<div class="card empty" th:if="${pagina.empty}"><h2>Nenhuma conversa nesta página</h2><p>Encontre um aparelho e clique em Conversar com o vendedor para começar.</p><a class="button secondary" th:href="@{/anuncios}">Explorar anúncios</a><p th:if="${pagina.number > 0}"><a th:href="@{/minha-conta/mensagens}">Voltar à primeira página</a></p></div>
<div class="chat-inbox"><a class="card conversation-item" th:each="item : ${pagina.content}" th:href="@{/minha-conta/mensagens/{id}(id=${item.id})}"><div class="conversation-top"><h2 th:text="${item.pessoa}"></h2><span class="chat-unread" th:if="${item.naoLidas > 0}" th:text="|${item.naoLidas} não lida(s)|"></span></div><p class="conversation-title" th:text="${item.titulo}"></p><p class="conversation-preview" th:text="${#strings.isEmpty(item.previa) ? 'Conversa iniciada. Envie a primeira mensagem.' : item.previa}"></p><small class="muted" th:text="${item.atualizadaEm}"></small></a></div>
<nav class="pagination" aria-label="Páginas de conversas" th:if="${pagina.totalPages > 1}"><a th:if="${pagina.hasPrevious()}" th:href="@{/minha-conta/mensagens(pagina=${pagina.number - 1})}">← Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a th:if="${pagina.hasNext()}" th:href="@{/minha-conta/mensagens(pagina=${pagina.number + 1})}">Próxima →</a></nav>
</section></body></html>
