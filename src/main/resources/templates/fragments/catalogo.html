<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<header class="topbar" th:fragment="header"><a class="skip" href="#conteudo">Ir para o conteúdo</a><a class="logo" th:href="@{/}">Compra<span>Segura</span></a><nav class="top-actions" aria-label="Navegação principal"><a th:href="@{/anuncios}">Explorar</a><a th:href="@{/comparar}">Comparar</a><a th:href="@{/seguranca}">Central de segurança</a><a th:if="${conectado}" th:href="@{/minha-conta}">Minha conta</a><a th:if="${conectado}" th:href="@{/minha-conta/mensagens}">Mensagens <span class="badge" hidden th:attr="data-contador-mensagens=@{/minha-conta/mensagens/nao-lidas}"></span></a><script th:if="${conectado}" defer th:src="@{/js/mensagens-contador.js}"></script><a th:unless="${conectado}" th:href="@{/login}">Entrar</a><a class="button" th:href="@{/minha-conta/anuncios/novo}">Anunciar</a></nav></header>
<article class="card listing-card" th:fragment="card(anuncio)"><a th:if="${anuncio.capa != null}" th:href="@{/anuncios/{id}(id=${anuncio.id})}"><img class="listing-photo" th:src="@{/anuncios/{id}/fotos/{foto}(id=${anuncio.id},foto=${anuncio.capa})}" th:alt="${anuncio.titulo}" loading="lazy"></a><div th:if="${anuncio.capa == null}" class="device-tile" aria-hidden="true"><span>▯</span></div><div class="listing-body"><label class="compare-choice" th:if="${comparacaoAtiva == true}"><input type="checkbox" name="ids" form="form-comparacao" th:value="${anuncio.id}" th:attr="data-comparison-id=${anuncio.id},data-comparison-title=${anuncio.titulo}"> Comparar aparelho</label><span class="badge" th:if="${anuncio.vendido}">Vendido · informado pelo vendedor</span><p class="eyebrow" th:text="${anuncio.tipo}"></p><h2><a th:href="@{/anuncios/{id}(id=${anuncio.id})}" th:text="${anuncio.titulo}"></a></h2><p th:text="${anuncio.marca + ' · ' + anuncio.modelo}"></p><span class="badge" th:text="${anuncio.condicao}"></span><p class="price" th:text="${anuncio.precoFormatado}"></p><div class="listing-meta"><div class="seller-identity"><img th:if="${anuncio.fotoPerfil}" class="seller-avatar" th:src="@{/vendedores/{id}/foto(id=${anuncio.vendedorId})}" alt="Foto do vendedor" loading="lazy"><a th:href="@{/vendedores/{id}(id=${anuncio.vendedorId})}" th:text="${anuncio.vendedorNome}"></a></div><span th:text="${anuncio.vendido ? 'Venda informada em ' + anuncio.vendaFormatada : anuncio.dataFormatada}"></span></div></div></article>
</body></html>
